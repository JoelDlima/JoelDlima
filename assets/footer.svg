<svg xmlns="http://www.w3.org/2000/svg" width="840" height="160" viewBox="0 0 840 160" role="img" aria-label="Joel D'Lima — Connect">
  <title>Joel D'Lima — Connect &amp; Stats</title>
  <desc>Footer with GitHub stats, connect links, and contribution activity</desc>

  <defs>
    <filter id="nb5" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="sg5" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="1.5" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="footer-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;600;700;800&amp;display=swap');
    .ft-main { font-family:'Inter','Segoe UI',system-ui,sans-serif; font-weight:800; font-size:20px; fill:#ffffff; }
    .ft-sub { font-family:'Inter','Segoe UI',system-ui,sans-serif; font-weight:300; font-size:13px; fill:#94a3b8; }
    .ft-link { font-family:'Inter','Segoe UI',system-ui,sans-serif; font-weight:600; font-size:12px; }
    .ft-tiny { font-family:'Inter','Segoe UI',system-ui,sans-serif; font-weight:300; font-size:10px; fill:#475569; }
    .ft-stat-num { font-family:'Inter','Segoe UI',system-ui,sans-serif; font-weight:800; font-size:18px; fill:#ffffff; }
    .ft-stat-label { font-family:'Inter','Segoe UI',system-ui,sans-serif; font-weight:300; font-size:10px; fill:#64748b; letter-spacing:1px; }

    .f1 { animation:fIn 0.6s cubic-bezier(0.16,1,0.3,1) 0.1s both; }
    .f2 { animation:fIn 0.6s cubic-bezier(0.16,1,0.3,1) 0.3s both; }
    @keyframes fIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    @media(prefers-reduced-motion:reduce){ .f1,.f2{animation-duration:0.01s} }
  </style>

  <!-- Background -->
  <rect width="840" height="160" rx="12" fill="#0a0a0f"/>
  <circle cx="420" cy="80" r="120" fill="#7c3aed" opacity="0.02" filter="url(#nb5)"/>

  <!-- Stars -->
  <g filter="url(#sg5)" opacity="0.3">
    <circle cx="80" cy="20" r="0.5" fill="#e2e8f0"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="30" r="0.5" fill="#cbd5e1"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="4s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="550" cy="15" r="0.6" fill="#e2e8f0"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.8s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="25" r="0.5" fill="#e2e8f0"><animate attributeName="opacity" values="0.3;0.85;0.3" dur="4.2s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="140" r="0.5" fill="#e2e8f0"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.3s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="135" r="0.6" fill="#cbd5e1"><animate attributeName="opacity" values="0.4;0.7;0.4" dur="4.5s" begin="0.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Top decorative line -->
  <line x1="0" y1="4" x2="840" y2="4" stroke="url(#footer-line)" stroke-width="1"/>

  <!-- Main content -->
  <g class="f1">
    <text x="420" y="50" text-anchor="middle" class="ft-main">Let's Build Something</text>
    <text x="420" y="72" text-anchor="middle" class="ft-sub">Always open to collaborations, hackathons, and cool ideas.</text>
  </g>

  <!-- Link pills -->
  <g class="f2">
    <!-- LinkedIn -->
    <rect x="155" y="90" width="100" height="30" rx="15" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.6"/>
    <text x="205" y="110" text-anchor="middle" class="ft-link" fill="#a78bfa">🔗 LinkedIn</text>

    <!-- GitHub -->
    <rect x="275" y="90" width="90" height="30" rx="15" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.6"/>
    <text x="320" y="110" text-anchor="middle" class="ft-link" fill="#67e8f9">🐙 GitHub</text>

    <!-- Portfolio -->
    <rect x="385" y="90" width="95" height="30" rx="15" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.6"/>
    <text x="432" y="110" text-anchor="middle" class="ft-link" fill="#c4b5fd">🌐 Portfolio</text>

    <!-- Email -->
    <rect x="500" y="90" width="85" height="30" rx="15" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>
    <text x="542" y="110" text-anchor="middle" class="ft-link" fill="#fbbf24">✉️ Email</text>

    <!-- Resume -->
    <rect x="605" y="90" width="90" height="30" rx="15" fill="none" stroke="#10b981" stroke-width="1" opacity="0.6"/>
    <text x="650" y="110" text-anchor="middle" class="ft-link" fill="#34d399">📄 Resume</text>
  </g>

  <!-- Footer note -->
  <text x="420" y="148" text-anchor="middle" class="ft-tiny">
    Crafted with care · Goa, India · github.com/JoelDlima
  </text>
</svg>
