<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280"
     role="img" aria-labelledby="tlTitle tlDesc">
  <title id="tlTitle">Trajectory 2023 to 2027</title>
  <desc id="tlDesc">A timeline that draws itself: B.E. ECE begins 2023, IoT projects 2025,
  AgroProfit and Lead Genius 2025-26, EpicForce Feb-Jun 2026, Visteon internship Jul-Oct 2026,
  graduation 2027.</desc>

  <defs>
    <style><![CDATA[
      .mono  { font-family: 'JetBrains Mono','Cascadia Code','Fira Code','SF Mono','Roboto Mono',Consolas,'Liberation Mono',monospace; }
      .title { font-size: 10px; font-weight: 700; letter-spacing: 0.8px; }
      .sub   { font-size: 8.5px; fill: #6e7681; letter-spacing: 0.4px; }
      .year  { font-size: 8px; font-weight: 700; letter-spacing: 1.6px; opacity: 0.85; }
      .now   { font-size: 7.5px; font-weight: 700; letter-spacing: 1.6px; }
      .lbl   { font-size: 8px; letter-spacing: 2.6px; font-weight: 700; fill: #4a5563; }
    ]]></style>
    <clipPath id="tlFrame"><rect x="0" y="0" width="900" height="280" rx="8"/></clipPath>
  </defs>

  <g clip-path="url(#tlFrame)">
    <rect width="900" height="280" fill="#0d1117"/>
    <rect x="0.5" y="0.5" width="899" height="279" rx="8" fill="none" stroke="#21262d"/>

    <text x="26" y="22" class="mono lbl">TRAJECTORY</text>
    <text x="874" y="22" text-anchor="end" class="mono lbl">2023 → 2027</text>
    <line x1="26" y1="32" x2="874" y2="32" stroke="#1b2531" stroke-width="0.8"/>

    <!-- Rail the axis is drawn over -->
    <line x1="100" y1="150" x2="800" y2="150" stroke="#1b2531" stroke-width="1"
          stroke-dasharray="2 5"/>

    <!-- The axis, drawing itself -->
    <line x1="100" y1="150" x2="800" y2="150" stroke="#30465c" stroke-width="1.6"
          stroke-dasharray="700" stroke-dashoffset="700">
      <animate attributeName="stroke-dashoffset" dur="11.0s" repeatCount="indefinite"
               keyTimes="0;0.27;0.9;0.965;1"
               values="700;0;0;700;700" calcMode="linear"/>
    </line>

    <!-- Leading edge of the draw -->
    <circle cy="150" r="3.5" fill="#8ecae6" opacity="0">
      <animate attributeName="cx" dur="11.0s" repeatCount="indefinite" calcMode="linear"
               keyTimes="0;0.27;1" values="100;800;800"/>
      <animate attributeName="opacity" dur="11.0s" repeatCount="indefinite"
               keyTimes="0;0.02;0.26;0.27;1" values="0;1;1;0;0"/>
    </circle>

  <g opacity="0">
    <animate attributeName="opacity" dur="11.0s" repeatCount="indefinite"
             keyTimes="0;0.012;0.9;0.965;1" values="0;1;1;0;0"/>
    <animateTransform attributeName="transform" type="translate" dur="11.0s"
                      repeatCount="indefinite" keyTimes="0;0.012;0.9;0.965;1" values="0 -6;0 0;0 0;0 0;0 0"/>
    <line x1="100" y1="144" x2="100" y2="120" stroke="#8b949e"
          stroke-width="0.9" stroke-opacity="0.5"/>
    <circle cx="100" cy="150" r="5" fill="#0d1117" stroke="#8b949e" stroke-width="1.6"/>
    <circle cx="100" cy="150" r="2" fill="#8b949e"/>
    <text x="100" y="112" text-anchor="middle" class="mono title" fill="#8b949e">B.E. ECE BEGINS</text>
    <text x="100" y="100"   text-anchor="middle" class="mono sub">AITD · GOA</text>
    <text x="100" y="86"  text-anchor="middle" class="mono year" fill="#8b949e">2023</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" dur="11.0s" repeatCount="indefinite"
             keyTimes="0;0.054;0.069;0.9;0.965;1" values="0;0;1;1;0;0"/>
    <animateTransform attributeName="transform" type="translate" dur="11.0s"
                      repeatCount="indefinite" keyTimes="0;0.054;0.069;0.9;0.965;1" values="0 6;0 6;0 0;0 0;0 0;0 0"/>
    <line x1="240" y1="156" x2="240" y2="180" stroke="#f6bd60"
          stroke-width="0.9" stroke-opacity="0.5"/>
    <circle cx="240" cy="150" r="5" fill="#0d1117" stroke="#f6bd60" stroke-width="1.6"/>
    <circle cx="240" cy="150" r="2" fill="#f6bd60"/>
    <text x="240" y="192" text-anchor="middle" class="mono title" fill="#f6bd60">SMART ECO-WELL</text>
    <text x="240" y="204"   text-anchor="middle" class="mono sub">PALLIATIVE CARE</text>
    <text x="240" y="218"  text-anchor="middle" class="mono year" fill="#f6bd60">2025</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" dur="11.0s" repeatCount="indefinite"
             keyTimes="0;0.108;0.123;0.9;0.965;1" values="0;0;1;1;0;0"/>
    <animateTransform attributeName="transform" type="translate" dur="11.0s"
                      repeatCount="indefinite" keyTimes="0;0.108;0.123;0.9;0.965;1" values="0 -6;0 -6;0 0;0 0;0 0;0 0"/>
    <line x1="380" y1="144" x2="380" y2="120" stroke="#b8a1ff"
          stroke-width="0.9" stroke-opacity="0.5"/>
    <circle cx="380" cy="150" r="5" fill="#0d1117" stroke="#b8a1ff" stroke-width="1.6"/>
    <circle cx="380" cy="150" r="2" fill="#b8a1ff"/>
    <text x="380" y="112" text-anchor="middle" class="mono title" fill="#b8a1ff">AGROPROFIT</text>
    <text x="380" y="100"   text-anchor="middle" class="mono sub">LEAD GENIUS</text>
    <text x="380" y="86"  text-anchor="middle" class="mono year" fill="#b8a1ff">2025–26</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" dur="11.0s" repeatCount="indefinite"
             keyTimes="0;0.162;0.177;0.9;0.965;1" values="0;0;1;1;0;0"/>
    <animateTransform attributeName="transform" type="translate" dur="11.0s"
                      repeatCount="indefinite" keyTimes="0;0.162;0.177;0.9;0.965;1" values="0 6;0 6;0 0;0 0;0 0;0 0"/>
    <line x1="520" y1="156" x2="520" y2="180" stroke="#3FCF8E"
          stroke-width="0.9" stroke-opacity="0.5"/>
    <circle cx="520" cy="150" r="5" fill="#0d1117" stroke="#3FCF8E" stroke-width="1.6"/>
    <circle cx="520" cy="150" r="2" fill="#3FCF8E"/>
    <text x="520" y="192" text-anchor="middle" class="mono title" fill="#3FCF8E">EPICFORCE</text>
    <text x="520" y="204"   text-anchor="middle" class="mono sub">INNERVERSE · REACT</text>
    <text x="520" y="218"  text-anchor="middle" class="mono year" fill="#3FCF8E">FEB–JUN 26</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" dur="11.0s" repeatCount="indefinite"
             keyTimes="0;0.216;0.231;0.9;0.965;1" values="0;0;1;1;0;0"/>
    <animateTransform attributeName="transform" type="translate" dur="11.0s"
                      repeatCount="indefinite" keyTimes="0;0.216;0.231;0.9;0.965;1" values="0 -6;0 -6;0 0;0 0;0 0;0 0"/>
    <line x1="660" y1="144" x2="660" y2="120" stroke="#3FCF8E"
          stroke-width="0.9" stroke-opacity="0.5"/>
    <circle cx="660" cy="150" r="5" fill="#0d1117" stroke="#3FCF8E" stroke-width="1.6"/>
    <circle cx="660" cy="150" r="2" fill="#3FCF8E"/>
    <text x="660" y="112" text-anchor="middle" class="mono title" fill="#3FCF8E">VISTEON</text>
    <text x="660" y="100"   text-anchor="middle" class="mono sub">SWE INTERN · PPO</text>
    <text x="660" y="86"  text-anchor="middle" class="mono year" fill="#3FCF8E">JUL–OCT 26</text>
    <circle cx="660" cy="150" r="5" fill="none" stroke="#3FCF8E" stroke-width="1.2">
      <animate attributeName="r"       dur="2.2s" repeatCount="indefinite" values="5;15;15"/>
      <animate attributeName="opacity" dur="2.2s" repeatCount="indefinite" values="0.75;0;0"/>
    </circle>
    <text x="660" y="170" text-anchor="middle"
          class="mono now" fill="#3FCF8E">▲ NOW</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" dur="11.0s" repeatCount="indefinite"
             keyTimes="0;0.27;0.285;0.9;0.965;1" values="0;0;1;1;0;0"/>
    <animateTransform attributeName="transform" type="translate" dur="11.0s"
                      repeatCount="indefinite" keyTimes="0;0.27;0.285;0.9;0.965;1" values="0 6;0 6;0 0;0 0;0 0;0 0"/>
    <line x1="800" y1="156" x2="800" y2="180" stroke="#8ecae6"
          stroke-width="0.9" stroke-opacity="0.5"/>
    <circle cx="800" cy="150" r="5" fill="#0d1117" stroke="#8ecae6" stroke-width="1.6"/>
    <circle cx="800" cy="150" r="2" fill="#8ecae6"/>
    <text x="800" y="192" text-anchor="middle" class="mono title" fill="#8ecae6">B.E. GRADUATION</text>
    <text x="800" y="204"   text-anchor="middle" class="mono sub">ECE</text>
    <text x="800" y="218"  text-anchor="middle" class="mono year" fill="#8ecae6">2027</text>
  </g>

    <line x1="26" y1="248" x2="874" y2="248" stroke="#1b2531" stroke-width="0.8"/>
    <text x="26" y="263" class="mono lbl">CGPA 9.70</text>
    <text x="874" y="263" text-anchor="end" class="mono lbl">AGNEL INSTITUTE OF TECHNOLOGY AND DESIGN</text>
  </g>
</svg>
