<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 900 320" width="900" height="320"
     role="img" aria-label="Joel D'Lima — Electronics and Computer Engineering student building connected embedded and software systems">

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&amp;family=Share+Tech+Mono&amp;display=swap');

      .name-text    { font-family: 'Cinzel', serif; font-size: 38px; font-weight: 700; fill: #e8e8e8; letter-spacing: 5px; }
      .subtitle     { font-family: 'Share Tech Mono', monospace; font-size: 12px; fill: #8ecae6; letter-spacing: 2px; }
      .node-label   { font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: 1.5px; }
      .node-sub     { font-family: 'Share Tech Mono', monospace; font-size: 8px; fill: #666; letter-spacing: 0.5px; }
      .tagline      { font-family: 'Share Tech Mono', monospace; font-size: 10px; fill: #444; letter-spacing: 1px; }
      .coord        { font-family: 'Share Tech Mono', monospace; font-size: 8px; fill: #2a2a2a; }
    </style>

    <!-- Starfield filter -->
    <filter id="glow-cyan">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-amber">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Orbital ellipse path (for animateMotion) -->
    <path id="orbit-path" d="M 450,160 m -220,0 a 220,55 0 1,1 440,0 a 220,55 0 1,1 -440,0" fill="none"/>

    <!-- Gradient backgrounds for nodes -->
    <radialGradient id="edge-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f6bd60" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f6bd60" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cloud-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8ecae6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8ecae6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ai-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b8a1ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#b8a1ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" fill="#0d1117" rx="6"/>

  <!-- Subtle grid / dotted texture -->
  <g opacity="0.08">
    <!-- Horizontal grid lines -->
    <line x1="0" y1="40"  x2="900" y2="40"  stroke="#8ecae6" stroke-width="0.3"/>
    <line x1="0" y1="80"  x2="900" y2="80"  stroke="#8ecae6" stroke-width="0.3"/>
    <line x1="0" y1="120" x2="900" y2="120" stroke="#8ecae6" stroke-width="0.3"/>
    <line x1="0" y1="160" x2="900" y2="160" stroke="#8ecae6" stroke-width="0.3"/>
    <line x1="0" y1="200" x2="900" y2="200" stroke="#8ecae6" stroke-width="0.3"/>
    <line x1="0" y1="240" x2="900" y2="240" stroke="#8ecae6" stroke-width="0.3"/>
    <line x1="0" y1="280" x2="900" y2="280" stroke="#8ecae6" stroke-width="0.3"/>
    <!-- Vertical grid lines -->
    <line x1="90"  y1="0" x2="90"  y2="320" stroke="#8ecae6" stroke-width="0.3"/>
    <line x1="180" y1="0" x2="180" y2="320" stroke="#8ecae6" stroke-width="0.3"/>
    <line x1="270" y1="0" x2="270" y2="320" stroke="#8ecae6" stroke-width="0.3"/>
    <line x1="360" y1="0" x2="360" y2="320" stroke="#8ecae6" stroke-width="0.3"/>
    <line x1="450" y1="0" x2="450" y2="320" stroke="#8ecae6" stroke-width="0.3"/>
    <line x1="540" y1="0" x2="540" y2="320" stroke="#8ecae6" stroke-width="0.3"/>
    <line x1="630" y1="0" x2="630" y2="320" stroke="#8ecae6" stroke-width="0.3"/>
    <line x1="720" y1="0" x2="720" y2="320" stroke="#8ecae6" stroke-width="0.3"/>
    <line x1="810" y1="0" x2="810" y2="320" stroke="#8ecae6" stroke-width="0.3"/>
  </g>

  <!-- Stars (random scatter) -->
  <g opacity="0.5">
    <circle cx="45"  cy="18"  r="0.8" fill="#fff"/>
    <circle cx="120" cy="55"  r="1"   fill="#fff"/>
    <circle cx="300" cy="22"  r="0.6" fill="#fff"/>
    <circle cx="380" cy="12"  r="1.1" fill="#fff"/>
    <circle cx="520" cy="30"  r="0.7" fill="#fff"/>
    <circle cx="680" cy="15"  r="0.9" fill="#fff"/>
    <circle cx="800" cy="45"  r="0.6" fill="#fff"/>
    <circle cx="840" cy="22"  r="1"   fill="#fff"/>
    <circle cx="870" cy="70"  r="0.8" fill="#fff"/>
    <circle cx="60"  cy="280" r="0.7" fill="#fff"/>
    <circle cx="200" cy="295" r="1"   fill="#fff"/>
    <circle cx="750" cy="290" r="0.8" fill="#fff"/>
    <circle cx="820" cy="275" r="0.6" fill="#fff"/>
    <circle cx="30"  cy="180" r="0.9" fill="#fff"/>
    <circle cx="880" cy="190" r="0.7" fill="#fff"/>
    <!-- Occasional slightly brighter star -->
    <circle cx="160" cy="35" r="1.4" fill="#8ecae6" opacity="0.6"/>
    <circle cx="740" cy="280" r="1.3" fill="#f6bd60" opacity="0.5"/>
  </g>

  <!-- ── ORBITAL ELLIPSE ── -->
  <!-- Outer glow of ellipse -->
  <ellipse cx="450" cy="160" rx="220" ry="55" fill="none" stroke="#1a4a6a" stroke-width="6" opacity="0.3"/>
  <!-- Main orbital track -->
  <ellipse cx="450" cy="160" rx="220" ry="55" fill="none" stroke="#1d3d5a" stroke-width="1" stroke-dasharray="4 6" opacity="0.6"/>

  <!-- ── NODE GLOWS ── -->
  <ellipse cx="230" cy="160" rx="45" ry="45" fill="url(#edge-glow)"/>
  <ellipse cx="670" cy="160" rx="45" ry="45" fill="url(#cloud-glow)"/>
  <ellipse cx="450" cy="105" rx="40" ry="35" fill="url(#ai-glow)"/>

  <!-- ── EDGE NODE (left) ── -->
  <circle cx="230" cy="160" r="10" fill="#0d1117" stroke="#f6bd60" stroke-width="1.5"/>
  <circle cx="230" cy="160" r="4"  fill="#f6bd60" opacity="0.9"/>
  <text x="230" y="185" text-anchor="middle" class="node-label" fill="#f6bd60">EDGE</text>
  <text x="230" y="196" text-anchor="middle" class="node-sub">ESP32 · SENSORS</text>

  <!-- ── CLOUD NODE (right) ── -->
  <circle cx="670" cy="160" r="10" fill="#0d1117" stroke="#8ecae6" stroke-width="1.5"/>
  <circle cx="670" cy="160" r="4"  fill="#8ecae6" opacity="0.9"/>
  <text x="670" y="185" text-anchor="middle" class="node-label" fill="#8ecae6">CLOUD</text>
  <text x="670" y="196" text-anchor="middle" class="node-sub">APIs · DATA</text>

  <!-- ── AI/INTERFACE NODE (top centre of ellipse) ── -->
  <circle cx="450" cy="105" r="10" fill="#0d1117" stroke="#b8a1ff" stroke-width="1.5"/>
  <circle cx="450" cy="105" r="4"  fill="#b8a1ff" opacity="0.9"/>
  <text x="450" y="92" text-anchor="middle" class="node-label" fill="#b8a1ff">INTERFACE</text>
  <text x="450" y="82" text-anchor="middle" class="node-sub">REACT · AI</text>

  <!-- Connector lines from centre to nodes (telemetry spokes) -->
  <line x1="240" y1="160" x2="438" y2="108" stroke="#2d2d3a" stroke-width="0.8" stroke-dasharray="3 4"/>
  <line x1="660" y1="160" x2="462" y2="108" stroke="#2d2d3a" stroke-width="0.8" stroke-dasharray="3 4"/>
  <line x1="240" y1="160" x2="658" y2="160" stroke="#2d2d3a" stroke-width="0.6" stroke-dasharray="2 5"/>

  <!-- ── ANIMATED SIGNAL DOT (amber, travels the orbital ellipse) ── -->
  <circle r="5" fill="#f6bd60" filter="url(#glow-amber)" opacity="0.95">
    <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear">
      <mpath xlink:href="#orbit-path"/>
    </animateMotion>
    <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- ── CENTRE: Name and subtitle ── -->
  <text x="450" y="155" text-anchor="middle" class="name-text">JOEL D'LIMA</text>
  <text x="450" y="173" text-anchor="middle" class="subtitle">Embedded systems × software engineering</text>

  <!-- ── TAGLINE (bottom) ── -->
  <text x="450" y="245" text-anchor="middle" class="tagline">[ sensor ] ──── telemetry ────▶ [ cloud ] ────▶ [ interface ]</text>

  <!-- ── COORDINATE LABELS (corners, decorative) ── -->
  <text x="14" y="14"  class="coord">15°29'N</text>
  <text x="14" y="24"  class="coord">73°49'E</text>
  <text x="820" y="14" class="coord">MAPUSA · GOA</text>
  <text x="820" y="24" class="coord">INDIA</text>
  <text x="14"  y="312" class="coord">ECE · AITD · 2027</text>
  <text x="800" y="312" class="coord">CGPA 9.7</text>

  <!-- ── TOP RULE ── -->
  <line x1="14" y1="30" x2="886" y2="30" stroke="#1a2a3a" stroke-width="0.5"/>
  <!-- ── BOTTOM RULE ── -->
  <line x1="14" y1="300" x2="886" y2="300" stroke="#1a2a3a" stroke-width="0.5"/>

  <!-- Subtle terminal-blink cursor at bottom right of name -->
  <rect x="558" y="138" width="8" height="18" fill="#8ecae6" opacity="0">
    <animate attributeName="opacity" values="0;0.7;0" dur="1.2s" repeatCount="indefinite"/>
  </rect>

</svg>
