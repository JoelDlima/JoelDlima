<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 210" width="420" height="210"
     role="img" aria-label="AgroProfit — AI agricultural market platform with Gemini advisory and Supabase data pipeline">
  <!-- Card 02: AgroProfit · Violet (#b8a1ff) -->

  <rect width="420" height="210" fill="#0d1117" rx="6"/>
  <rect width="420" height="210" fill="none" stroke="#21262d" stroke-width="1" rx="6"/>
  <rect x="0" y="0" width="3" height="210" fill="#b8a1ff" rx="1.5"/>

  <!-- Top row -->
  <circle cx="20" cy="20" r="3.5" fill="#b8a1ff" opacity="0.9"/>
  <text x="30" y="24"
        font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,monospace"
        font-size="9" fill="#b8a1ff" letter-spacing="1.5" font-weight="700">MISSION 02 · AI + FULL-STACK</text>

  <rect x="318" y="11" width="88" height="17" rx="3" fill="#2a1a4a" stroke="#b8a1ff" stroke-width="0.8"/>
  <text x="362" y="23" text-anchor="middle"
        font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace"
        font-size="8" fill="#b8a1ff" letter-spacing="1" font-weight="700">LENOVO LEAP ✦</text>

  <line x1="14" y1="34" x2="406" y2="34" stroke="#21262d" stroke-width="0.8"/>

  <text x="18" y="57"
        font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,monospace"
        font-size="18" fill="#e6edf3" font-weight="700" letter-spacing="1">AGROPROFIT</text>

  <text x="18" y="71"
        font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace"
        font-size="9.5" fill="#6e7681" font-weight="400">AI Agricultural Market Platform  ·  Sep 2025 – Jan 2026</text>

  <line x1="14" y1="81" x2="406" y2="81" stroke="#21262d" stroke-width="0.8"/>

  <text x="18" y="97"
        font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace"
        font-size="9.5" fill="#cdd9e5" font-weight="400">Govt. mandi prices → sync pipeline → Supabase → React dashboard</text>
  <text x="18" y="112"
        font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace"
        font-size="9.5" fill="#cdd9e5" font-weight="400">Gemini advisory: price snapshot + contextual crop recommendation</text>

  <text x="18" y="129"
        font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace"
        font-size="8.5" fill="#484f58" font-weight="400">↳ result: Lenovo LEAP Culmination — AI-driven innovation in agriculture</text>

  <line x1="14" y1="141" x2="406" y2="141" stroke="#21262d" stroke-width="0.8"/>

  <!-- React -->
  <rect x="18"  y="153" width="42" height="17" rx="3" fill="#1c1f24" stroke="#61DAFB" stroke-width="0.8"/>
  <text x="39"  y="165" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="8" fill="#61DAFB" font-weight="700">React</text>
  <!-- TypeScript -->
  <rect x="66"  y="153" width="68" height="17" rx="3" fill="#1c1f24" stroke="#3178C6" stroke-width="0.8"/>
  <text x="100" y="165" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="8" fill="#5b9bd5" font-weight="700">TypeScript</text>
  <!-- Node.js -->
  <rect x="140" y="153" width="52" height="17" rx="3" fill="#1c1f24" stroke="#5FA04E" stroke-width="0.8"/>
  <text x="166" y="165" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="8" fill="#5FA04E" font-weight="700">Node.js</text>
  <!-- Supabase -->
  <rect x="198" y="153" width="58" height="17" rx="3" fill="#1c1f24" stroke="#3FCF8E" stroke-width="0.8"/>
  <text x="227" y="165" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="8" fill="#3FCF8E" font-weight="700">Supabase</text>
  <!-- Gemini -->
  <rect x="262" y="153" width="50" height="17" rx="3" fill="#1c1f24" stroke="#b8a1ff" stroke-width="0.8"/>
  <text x="287" y="165" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="8" fill="#b8a1ff" font-weight="700">Gemini</text>

  <!-- Corner: data-node dots -->
  <circle cx="384" cy="156" r="2.5" fill="#b8a1ff" opacity="0.2"/>
  <circle cx="396" cy="156" r="2.5" fill="#b8a1ff" opacity="0.35"/>
  <circle cx="390" cy="166" r="2.5" fill="#b8a1ff" opacity="0.5"/>
  <line x1="384" y1="156" x2="396" y2="156" stroke="#b8a1ff" stroke-width="0.6" opacity="0.2"/>
  <line x1="396" y1="156" x2="390" y2="166" stroke="#b8a1ff" stroke-width="0.6" opacity="0.2"/>
  <line x1="390" y1="166" x2="384" y2="156" stroke="#b8a1ff" stroke-width="0.6" opacity="0.2"/>

  <text x="18" y="200"
        font-family="'JetBrains Mono',Consolas,monospace"
        font-size="7.5" fill="#2d333b" letter-spacing="0.5">AITD · GOA · INDIA</text>
  <text x="380" y="200" text-anchor="end"
        font-family="'JetBrains Mono',Consolas,monospace"
        font-size="7.5" fill="#2d333b" letter-spacing="0.5">ECE · 2027</text>
</svg>
