    <g stroke="#8ecae6" stroke-width="0.3" opacity="0.06"><path d="M0 30 H460"/><path d="M0 60 H460"/><path d="M0 90 H460"/><path d="M0 120 H460"/><path d="M0 150 H460"/><path d="M0 180 H460"/><path d="M40 0 V200"/><path d="M80 0 V200"/><path d="M120 0 V200"/><path d="M160 0 V200"/><path d="M200 0 V200"/><path d="M240 0 V200"/><path d="M280 0 V200"/><path d="M320 0 V200"/><path d="M360 0 V200"/><path d="M400 0 V200"/><path d="M440 0 V200"/></g>
    <g stroke="#8ecae6" stroke-width="1" fill="none" opacity="0.45">
