<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" width="460" height="200"
     role="img" aria-labelledby="cardTitle cardDesc">
  <title id="cardTitle">Contribution index</title>
  <desc id="cardDesc">70 commits, 11 repositories, 4 stars, 8 followers.</desc>
  <defs>
    <style><![CDATA[
      .m { font-family: 'JetBrains Mono','Cascadia Code','Fira Code','SF Mono','Roboto Mono',Consolas,'Liberation Mono',monospace; }
      .cap { font-size: 8px; letter-spacing: 2.4px; font-weight: 700; fill: #4a5563; }
      .val { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
      .lbl { font-size: 7px; letter-spacing: 1.5px; font-weight: 700; fill: #8b949e; }
      .sub { font-size: 8px; letter-spacing: 0.8px; fill: #4a5563; }
      .rise { animation: rise .7s cubic-bezier(.2,.8,.3,1) both; }
      @keyframes rise { from { opacity: 0 } to { opacity: 1 } }
      @media (prefers-reduced-motion: reduce) { .rise { animation: none } }
    ]]></style>
    
    <clipPath id="frame"><rect width="460" height="200" rx="8"/></clipPath>
  </defs>
