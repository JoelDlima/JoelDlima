<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 236" width="440" height="236"
     role="img" aria-labelledby="obsTitle obsDesc">
  <title id="obsTitle">Arrival paths</title>
  <desc id="obsDesc">Where visitors came from over the last 14 days: github.com 10 unique, linkedin.com 2 unique, com.linkedin.android 1 unique, instagram.com 1 unique.</desc>
  <defs>
    <style><![CDATA[
      .m { font-family: 'JetBrains Mono','Cascadia Code','Fira Code','SF Mono','Roboto Mono',Consolas,'Liberation Mono',monospace; }
      .cap { font-size: 8px; letter-spacing: 2.4px; font-weight: 700; fill: #4a5563; }
      .val { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
      .lbl { font-size: 7px; letter-spacing: 1.5px; font-weight: 700; fill: #8b949e; }
      .sub { font-family: Inter,'Inter Tight','SF Pro Text','Segoe UI Variable Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; font-size: 8.5px; letter-spacing: 0.2px; fill: #4a5563; }
      .row { font-family: Inter,'Inter Tight','SF Pro Text','Segoe UI Variable Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; font-size: 10.5px; font-weight: 600; fill: #e6edf3; }
      .tiny { font-size: 8px; fill: #4a5563; }
      .rise { animation: rise .7s cubic-bezier(.2,.8,.3,1) both; }
      @keyframes rise { from { opacity: 0 } to { opacity: 1 } }
      @media (prefers-reduced-motion: reduce) { .rise { animation: none } }
    ]]></style>
    
    <clipPath id="frame"><rect width="440" height="236" rx="8"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="440" height="236" fill="#0d1117"/>
    <g stroke="#8ecae6" stroke-width="0.3" opacity="0.06"><path d="M0 30 H440"/><path d="M0 60 H440"/><path d="M0 90 H440"/><path d="M0 120 H440"/><path d="M0 150 H440"/><path d="M0 180 H440"/><path d="M0 210 H440"/><path d="M40 0 V236"/><path d="M80 0 V236"/><path d="M120 0 V236"/><path d="M160 0 V236"/><path d="M200 0 V236"/><path d="M240 0 V236"/><path d="M280 0 V236"/><path d="M320 0 V236"/><path d="M360 0 V236"/><path d="M400 0 V236"/></g>
    <g stroke="#8ecae6" stroke-width="1" fill="none" opacity="0.45">
      <path d="M10 22V10h12"/><path d="M418 10h12v12"/>
      <path d="M430 214v12h-12"/><path d="M22 226H10v-12"/>
    </g>
    <text class="m cap" x="24" y="34">ARRIVAL PATHS</text>
    <text class="m sub" x="416" y="34" text-anchor="end">ROLLING 14 DAYS</text>
    <path d="M24 46H416" stroke="#8ecae6" stroke-opacity="0.14"/>
    <g class="rise" style="animation-delay:0.00s">
      <text class="m row" x="24" y="72">github.com</text>
      <text class="m tiny" x="416" y="72" text-anchor="end">10 / 109</text>
      <rect x="24" y="78" width="250.0" height="3" rx="1.5" fill="#8ecae6" opacity="0.75"/>
      <rect x="24" y="78" width="250" height="3" rx="1.5" fill="#8ecae6" opacity="0.10"/>
    </g>
    <g class="rise" style="animation-delay:0.05s">
      <text class="m row" x="24" y="100">linkedin.com</text>
      <text class="m tiny" x="416" y="100" text-anchor="end">2 / 2</text>
      <rect x="24" y="106" width="50.0" height="3" rx="1.5" fill="#8ecae6" opacity="0.75"/>
      <rect x="24" y="106" width="250" height="3" rx="1.5" fill="#8ecae6" opacity="0.10"/>
    </g>
    <g class="rise" style="animation-delay:0.10s">
      <text class="m row" x="24" y="128">com.linkedin.android</text>
      <text class="m tiny" x="416" y="128" text-anchor="end">1 / 1</text>
      <rect x="24" y="134" width="25.0" height="3" rx="1.5" fill="#8ecae6" opacity="0.75"/>
      <rect x="24" y="134" width="250" height="3" rx="1.5" fill="#8ecae6" opacity="0.10"/>
    </g>
    <g class="rise" style="animation-delay:0.15s">
      <text class="m row" x="24" y="156">instagram.com</text>
      <text class="m tiny" x="416" y="156" text-anchor="end">1 / 1</text>
      <rect x="24" y="162" width="25.0" height="3" rx="1.5" fill="#8ecae6" opacity="0.75"/>
      <rect x="24" y="162" width="250" height="3" rx="1.5" fill="#8ecae6" opacity="0.10"/>
    </g>
    <text class="m tiny" x="416" y="60" text-anchor="end">UNIQUE / TOTAL</text>

  </g>
  <rect width="439" height="235" x="0.5" y="0.5" rx="8" fill="none"
        stroke="#8ecae6" stroke-opacity="0.18"/>
</svg>
