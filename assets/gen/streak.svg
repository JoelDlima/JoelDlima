<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" width="460" height="200"
     role="img" aria-labelledby="cardTitle cardDesc">
  <title id="cardTitle">Contribution streaks</title>
  <desc id="cardDesc">Current streak 1 days, longest streak 2 days, 89 contributions in total.</desc>
  <defs>
    <style><![CDATA[
      .m { font-family: 'JetBrains Mono','Cascadia Code','Fira Code','SF Mono','Roboto Mono',Consolas,'Liberation Mono',monospace; }
      .cap { font-size: 8px; letter-spacing: 2.4px; font-weight: 700; fill: #4a5563; }
      .val { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
      .lbl { font-size: 7px; letter-spacing: 1.5px; font-weight: 700; fill: #8b949e; }
      .sub { font-size: 8px; letter-spacing: 0.8px; fill: #4a5563; }
      .rise { animation: rise .7s cubic-bezier(.2,.8,.3,1) both; }
      @keyframes rise { from { opacity: 0 } to { opacity: 1 } }
      @media (prefers-reduced-motion: reduce) { .rise { animation: none } }
    ]]></style>
    
    <clipPath id="frame"><rect width="460" height="200" rx="8"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="460" height="200" fill="#0d1117"/>
    <g stroke="#8ecae6" stroke-width="0.3" opacity="0.06"><path d="M0 30 H460"/><path d="M0 60 H460"/><path d="M0 90 H460"/><path d="M0 120 H460"/><path d="M0 150 H460"/><path d="M0 180 H460"/><path d="M40 0 V200"/><path d="M80 0 V200"/><path d="M120 0 V200"/><path d="M160 0 V200"/><path d="M200 0 V200"/><path d="M240 0 V200"/><path d="M280 0 V200"/><path d="M320 0 V200"/><path d="M360 0 V200"/><path d="M400 0 V200"/><path d="M440 0 V200"/></g>
    <g stroke="#8ecae6" stroke-width="1" fill="none" opacity="0.45">
      <path d="M10 22V10h12"/><path d="M438 10h12v12"/>
      <path d="M450 178v12h-12"/><path d="M22 190H10v-12"/>
    </g>
    <text class="m cap" x="24" y="34">CONSISTENCY</text>
    <path d="M24 48H436" stroke="#8ecae6" stroke-opacity="0.14"/>
    <g class="rise" style="animation-delay:.10s">
      <text class="m val" x="24" y="104" fill="#8ecae6">89</text>
      <text class="m lbl" x="24" y="118">TOTAL CONTRIBUTIONS</text>
      <text class="m sub" x="24" y="134">since Jan 2, 2025</text>
    </g>
    <g class="rise" style="animation-delay:.20s">
      <text class="m val" x="436" y="104" text-anchor="end" fill="#b8a1ff">2</text>
      <text class="m lbl" x="436" y="118" text-anchor="end">LONGEST STREAK</text>
      <text class="m sub" x="436" y="134" text-anchor="end">from Mar 9, 2025</text>
    </g>
    <g transform="translate(230,92)">
      <circle r="42" fill="none" stroke="#f6bd60" stroke-opacity="0.16" stroke-width="1.5"/>
      <circle r="42" fill="none" stroke="#f6bd60" stroke-width="1.5" stroke-linecap="round"
              stroke-dasharray="264" stroke-dashoffset="264" transform="rotate(-90)">
        <animate attributeName="stroke-dashoffset" from="264" to="46" dur="1.1s"
                 begin="0.2s" fill="freeze" calcMode="spline"
                 keySplines="0.2 0.8 0.3 1"/>
      </circle>
      <text class="m" x="0" y="4" text-anchor="middle" font-size="32"
            font-weight="700" fill="#f6bd60">1</text>
      <text class="m lbl" x="0" y="22" text-anchor="middle">CURRENT STREAK &#183; DAYS</text>
      <text class="m sub" x="0" y="38" text-anchor="middle">Aug 22, 2026 &#8594; Aug 22, 2026</text>
    </g>

  </g>
  <rect width="459" height="199" x="0.5" y="0.5" rx="8" fill="none"
        stroke="#8ecae6" stroke-opacity="0.18"/>
</svg>
