<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 210" width="420" height="210"
     role="img" aria-label="Palliative Care — remote patient monitoring prototype with IoT vitals, cloud dashboard, and AI caregiver assistant">
  <defs>
    <clipPath id="cardClip"><rect x="0" y="0" width="420" height="210" rx="6"/></clipPath>
    <linearGradient id="stripLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#8ecae6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8ecae6" stop-opacity="1"/>
      <stop offset="1"   stop-color="#8ecae6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardScan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#8ecae6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8ecae6" stop-opacity="0.055"/>
      <stop offset="1"   stop-color="#8ecae6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Card 03: Palliative Care · Cyan (#8ecae6) -->

  <rect width="420" height="210" fill="#0d1117" rx="6"/>
  <rect width="420" height="210" fill="none" stroke="#21262d" stroke-width="1" rx="6"/>
  <rect x="0" y="0" width="3" height="210" fill="#8ecae6" rx="1.5" opacity="0.3"/>
  <rect x="0" width="3" height="56" fill="url(#stripLight)" rx="1.5">
    <animate attributeName="y" values="-56;210" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Top row -->
  <circle cx="20" cy="20" r="3.5" fill="#8ecae6" opacity="0.9">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="20" cy="20" r="3.5" fill="none" stroke="#8ecae6" stroke-width="0.9">
    <animate attributeName="r"       values="3.5;11;11" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0"   dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="30" y="24"
        font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,monospace"
        font-size="9" fill="#8ecae6" letter-spacing="1.5" font-weight="700">MISSION 03 · IoT + CLOUD</text>

  <rect x="330" y="11" width="76" height="17" rx="3" fill="#122030" stroke="#8ecae6" stroke-width="0.8"/>
  <text x="368" y="23" text-anchor="middle"
        font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace"
        font-size="8" fill="#8ecae6" letter-spacing="1" font-weight="700">PROTOTYPE</text>

  <line x1="14" y1="34" x2="406" y2="34" stroke="#21262d" stroke-width="0.8"/>

  <text x="18" y="57"
        font-family="'JetBrains Mono','Cascadia Code','Fira Code',Consolas,monospace"
        font-size="18" fill="#e6edf3" font-weight="700" letter-spacing="1">PALLIATIVE CARE</text>

  <text x="18" y="71"
        font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace"
        font-size="9.5" fill="#6e7681" font-weight="400">Remote Patient Monitoring Prototype  ·  Sep – Oct 2025</text>

  <line x1="14" y1="81" x2="406" y2="81" stroke="#21262d" stroke-width="0.8"/>

  <text x="18" y="97"
        font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace"
        font-size="9.5" fill="#cdd9e5" font-weight="400">SpO₂ · HR · ECG · fall sensors → ESP32 → cloud vitals dashboard</text>
  <text x="18" y="112"
        font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace"
        font-size="9.5" fill="#cdd9e5" font-weight="400">Role-based access · threshold alerts · geolocation · AI assistant</text>

  <text x="18" y="129"
        font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace"
        font-size="8.5" fill="#484f58" font-weight="400">↳ hard: alert thresholds tuned to suppress sensor-noise false positives</text>

  <line x1="14" y1="141" x2="406" y2="141" stroke="#21262d" stroke-width="0.8"/>

  <!-- ESP32 -->
  <rect x="18"  y="153" width="43" height="17" rx="3" fill="#1c1f24" stroke="#E7352C" stroke-width="0.8"/>
  <text x="39"  y="165" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="8" fill="#E7352C" font-weight="700">ESP32</text>
  <!-- Python -->
  <rect x="67"  y="153" width="48" height="17" rx="3" fill="#1c1f24" stroke="#3776AB" stroke-width="0.8"/>
  <text x="91"  y="165" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="8" fill="#5b9fd4" font-weight="700">Python</text>
  <!-- Sensors -->
  <rect x="121" y="153" width="54" height="17" rx="3" fill="#1c1f24" stroke="#f6bd60" stroke-width="0.8"/>
  <text x="148" y="165" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="8" fill="#f6bd60" font-weight="700">Sensors</text>
  <!-- Cloud -->
  <rect x="181" y="153" width="44" height="17" rx="3" fill="#1c1f24" stroke="#8ecae6" stroke-width="0.8"/>
  <text x="203" y="165" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="8" fill="#8ecae6" font-weight="700">Cloud</text>
  <!-- Role-ACL -->
  <rect x="231" y="153" width="60" height="17" rx="3" fill="#1c1f24" stroke="#6366F1" stroke-width="0.8"/>
  <text x="261" y="165" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="8" fill="#818cf8" font-weight="700">Role-ACL</text>

  <!-- Corner decoration: heartbeat pulse line -->
  <polyline points="372,162 378,162 381,155 385,170 388,155 392,162 402,162"
            stroke="#8ecae6" stroke-width="1" fill="none" opacity="0.22"/>

  <text x="18" y="200"
        font-family="'JetBrains Mono',Consolas,monospace"
        font-size="7.5" fill="#2d333b" letter-spacing="0.5">AITD · GOA · INDIA</text>
  <text x="380" y="200" text-anchor="end"
        font-family="'JetBrains Mono',Consolas,monospace"
        font-size="7.5" fill="#2d333b" letter-spacing="0.5">ECE · 2027</text>

  <!-- Ambient motion layer -->
  <g clip-path="url(#cardClip)">
    <rect x="0" width="420" height="50" fill="url(#cardScan)">
      <animate attributeName="y" values="-50;210" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="0.5" y="0.5" width="419" height="209" rx="6" fill="none"
        stroke="#8ecae6" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0.2;0" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>
