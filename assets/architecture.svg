<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 900 330" width="900" height="330"
     role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">System architecture I build across</title>
  <desc id="archDesc">Sensors feed an ESP32 edge device, which streams telemetry to cloud
  storage. The cloud fans out to a React interface, an AI advisory layer built on Gemini and
  Ollama, and a threshold alerting path. The AI layer feeds back into the interface.</desc>

  <defs>
    <style><![CDATA[
      .mono { font-family: 'JetBrains Mono','Cascadia Code','Fira Code','SF Mono',
                          'Roboto Mono',Consolas,'Liberation Mono',monospace; }
      .n1   { font-size: 9.5px; font-weight: 700; letter-spacing: 1px; }
      .n2   { font-size: 7.5px; fill: #6e7681; letter-spacing: 0.3px; }
      .lbl  { font-size: 8px; letter-spacing: 2.6px; font-weight: 700; fill: #4a5563; }
      .tag  { font-size: 7px; letter-spacing: 1.4px; font-weight: 700; }
    ]]></style>

    <clipPath id="archFrame"><rect x="0" y="0" width="900" height="330" rx="8"/></clipPath>

    <filter id="pglow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Motion paths: packets ride these, the visible edges are drawn separately -->
    <path id="pA" d="M175 165 H210" fill="none"/>
    <path id="pB" d="M355 165 H390" fill="none"/>
    <path id="pUp"   d="M535 165 H590 V80 H660"  fill="none"/>
    <path id="pMid"  d="M535 165 H660"           fill="none"/>
    <path id="pDown" d="M535 165 H590 V250 H660" fill="none"/>
    <path id="pFb"   d="M840 165 H862 V80 H840"  fill="none"/>
  </defs>

  <g clip-path="url(#archFrame)">
    <rect width="900" height="330" fill="#0d1117"/>
    <rect x="0.5" y="0.5" width="899" height="329" rx="8" fill="none" stroke="#21262d"/>

    <g stroke="#8ecae6" stroke-width="0.3" opacity="0.05">
      <path d="M0 60H900M0 120H900M0 180H900M0 240H900M0 300H900"/>
      <path d="M75 0V330M150 0V330M225 0V330M300 0V330M375 0V330M450 0V330M525 0V330M600 0V330M675 0V330M750 0V330M825 0V330"/>
    </g>

    <text x="26" y="22" class="mono lbl">SYSTEMS I WORK ACROSS</text>
    <text x="874" y="22" text-anchor="end" class="mono lbl">SENSOR → CLOUD → INTERFACE</text>
    <line x1="26" y1="32" x2="874" y2="32" stroke="#1b2531" stroke-width="0.8"/>

    <!-- ══ EDGES ══ -->
    <g stroke="#2d333b" stroke-width="1.1" fill="none">
      <path d="M175 165 H210"/>
      <path d="M355 165 H390"/>
      <path d="M535 165 H660"/>
      <path d="M590 165 V80 H660"/>
      <path d="M590 165 V250 H660"/>
    </g>
    <!-- Feedback edge, dashed to read as a return path -->
    <path d="M840 165 H862 V80 H840" stroke="#b8a1ff" stroke-width="1" fill="none"
          stroke-dasharray="3 3" opacity="0.45"/>

    <!-- Branch spine joint -->
    <circle cx="590" cy="165" r="3" fill="#0d1117" stroke="#8ecae6" stroke-width="1.2"/>

    <!-- Arrowheads -->
    <g fill="#3d4653">
      <polygon points="204,161 211,165 204,169"/>
      <polygon points="384,161 391,165 384,169"/>
      <polygon points="654,76  661,80  654,84"/>
      <polygon points="654,161 661,165 654,169"/>
      <polygon points="654,246 661,250 654,254"/>
    </g>
    <polygon points="846,76 839,80 846,84" fill="#b8a1ff" opacity="0.6"/>

    <!-- ══ NODES ══ -->
    <!-- Sensors -->
    <rect x="30" y="146" width="145" height="38" rx="5" fill="#12180f" stroke="#f6bd60" stroke-width="1"/>
    <circle cx="42" cy="165" r="2.5" fill="#f6bd60" filter="url(#pglow)">
      <animate attributeName="r" dur="6s" repeatCount="indefinite" keyTimes="0;0.06;1" values="5;2.5;2.5"/>
    </circle>
    <text x="110" y="162" text-anchor="middle" class="mono n1" fill="#f6bd60">SENSORS</text>
    <text x="110" y="174" text-anchor="middle" class="mono n2">TDS · pH · SpO2 · ECG</text>

    <!-- Edge device -->
    <rect x="210" y="146" width="145" height="38" rx="5" fill="#12180f" stroke="#f6bd60" stroke-width="1"/>
    <circle cx="222" cy="165" r="2.5" fill="#f6bd60" filter="url(#pglow)">
      <animate attributeName="r" dur="6s" repeatCount="indefinite" keyTimes="0;0.15;0.23;1" values="2.5;5;2.5;2.5"/>
    </circle>
    <text x="290" y="162" text-anchor="middle" class="mono n1" fill="#f6bd60">ESP32 EDGE</text>
    <text x="290" y="174" text-anchor="middle" class="mono n2">C/C++ · I2C · SPI · UART</text>

    <!-- Cloud -->
    <rect x="390" y="146" width="145" height="38" rx="5" fill="#0f1a22" stroke="#8ecae6" stroke-width="1"/>
    <circle cx="402" cy="165" r="2.5" fill="#8ecae6" filter="url(#pglow)">
      <animate attributeName="r" dur="6s" repeatCount="indefinite" keyTimes="0;0.32;0.40;1" values="2.5;5;2.5;2.5"/>
    </circle>
    <text x="468" y="162" text-anchor="middle" class="mono n1" fill="#8ecae6">CLOUD</text>
    <text x="468" y="174" text-anchor="middle" class="mono n2">SUPABASE · REST API</text>

    <!-- Interface -->
    <rect x="660" y="61" width="180" height="38" rx="5" fill="#0f1a22" stroke="#8ecae6" stroke-width="1"/>
    <circle cx="672" cy="80" r="2.5" fill="#8ecae6" filter="url(#pglow)">
      <animate attributeName="r" dur="6s" repeatCount="indefinite" keyTimes="0;0.60;0.68;0.77;0.85;1" values="2.5;5;2.5;5;2.5;2.5"/>
    </circle>
    <text x="756" y="77" text-anchor="middle" class="mono n1" fill="#8ecae6">INTERFACE</text>
    <text x="756" y="89" text-anchor="middle" class="mono n2">REACT · TYPESCRIPT</text>

    <!-- AI advisory -->
    <rect x="660" y="146" width="180" height="38" rx="5" fill="#171426" stroke="#b8a1ff" stroke-width="1"/>
    <circle cx="672" cy="165" r="2.5" fill="#b8a1ff" filter="url(#pglow)">
      <animate attributeName="r" dur="6s" repeatCount="indefinite" keyTimes="0;0.60;0.68;1" values="2.5;5;2.5;2.5"/>
    </circle>
    <text x="756" y="162" text-anchor="middle" class="mono n1" fill="#b8a1ff">AI ADVISORY</text>
    <text x="756" y="174" text-anchor="middle" class="mono n2">GEMINI · OLLAMA</text>

    <!-- Alerts -->
    <rect x="660" y="231" width="180" height="38" rx="5" fill="#1f1214" stroke="#ff6b6b" stroke-width="1"/>
    <circle cx="672" cy="250" r="2.5" fill="#ff6b6b" filter="url(#pglow)">
      <animate attributeName="r" dur="6s" repeatCount="indefinite" keyTimes="0;0.60;0.68;1" values="2.5;5;2.5;2.5"/>
    </circle>
    <text x="756" y="247" text-anchor="middle" class="mono n1" fill="#ff6b6b">ALERTS</text>
    <text x="756" y="259" text-anchor="middle" class="mono n2">THRESHOLD · GEOSPATIAL</text>

    <!-- ══ PACKETS ══ -->
    <!-- sensors → edge -->
    <circle r="3.4" fill="#f6bd60" opacity="0" filter="url(#pglow)">
      <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear"
                     keyPoints="0;0;1;1" keyTimes="0;0.02;0.15;1">
        <mpath xlink:href="#pA"/>
      </animateMotion>
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
               keyTimes="0;0.015;0.02;0.14;0.15;1" values="0;0;1;1;0;0"/>
    </circle>

    <!-- edge → cloud -->
    <circle r="3.4" fill="#f6bd60" opacity="0" filter="url(#pglow)">
      <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear"
                     keyPoints="0;0;1;1" keyTimes="0;0.17;0.32;1">
        <mpath xlink:href="#pB"/>
      </animateMotion>
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
               keyTimes="0;0.165;0.17;0.31;0.32;1" values="0;0;1;1;0;0"/>
    </circle>

    <!-- cloud fans out to all three consumers at once -->
    <circle r="3.4" fill="#8ecae6" opacity="0" filter="url(#pglow)">
      <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear"
                     keyPoints="0;0;1;1" keyTimes="0;0.35;0.60;1">
        <mpath xlink:href="#pUp"/>
      </animateMotion>
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
               keyTimes="0;0.345;0.35;0.59;0.60;1" values="0;0;1;1;0;0"/>
    </circle>
    <circle r="3.4" fill="#b8a1ff" opacity="0" filter="url(#pglow)">
      <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear"
                     keyPoints="0;0;1;1" keyTimes="0;0.35;0.60;1">
        <mpath xlink:href="#pMid"/>
      </animateMotion>
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
               keyTimes="0;0.345;0.35;0.59;0.60;1" values="0;0;1;1;0;0"/>
    </circle>
    <circle r="3.4" fill="#ff6b6b" opacity="0" filter="url(#pglow)">
      <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear"
                     keyPoints="0;0;1;1" keyTimes="0;0.35;0.60;1">
        <mpath xlink:href="#pDown"/>
      </animateMotion>
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
               keyTimes="0;0.345;0.35;0.59;0.60;1" values="0;0;1;1;0;0"/>
    </circle>

    <!-- AI advisory feeds back into the interface -->
    <circle r="3" fill="#b8a1ff" opacity="0" filter="url(#pglow)">
      <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear"
                     keyPoints="0;0;1;1" keyTimes="0;0.63;0.77;1">
        <mpath xlink:href="#pFb"/>
      </animateMotion>
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
               keyTimes="0;0.625;0.63;0.76;0.77;1" values="0;0;1;1;0;0"/>
    </circle>

    <!-- Domain key -->
    <line x1="26" y1="298" x2="874" y2="298" stroke="#1b2531" stroke-width="0.8"/>
    <g class="mono tag">
      <rect x="26"  y="306" width="7" height="7" rx="1.5" fill="#f6bd60"/>
      <text x="39"  y="313" fill="#6e7681">HARDWARE</text>
      <rect x="126" y="306" width="7" height="7" rx="1.5" fill="#8ecae6"/>
      <text x="139" y="313" fill="#6e7681">SOFTWARE</text>
      <rect x="226" y="306" width="7" height="7" rx="1.5" fill="#b8a1ff"/>
      <text x="239" y="313" fill="#6e7681">AI</text>
      <rect x="286" y="306" width="7" height="7" rx="1.5" fill="#ff6b6b"/>
      <text x="299" y="313" fill="#6e7681">SAFETY-CRITICAL</text>
    </g>
    <text x="874" y="313" text-anchor="end" class="mono lbl">ONE PATH · PIN TO SCREEN</text>
  </g>
</svg>
