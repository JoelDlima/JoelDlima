<svg xmlns="http://www.w3.org/2000/svg" width="840" height="520" viewBox="0 0 840 520" role="img" aria-label="Joel D'Lima — Projects">
  <title>Joel D'Lima — Featured Projects</title>
  <desc>Project showcase with AgroProfit, Smart Eco-Well, Lead Genius, and yt-cli</desc>

  <defs>
    <filter id="nb" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="sg" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="1.5" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="card-glow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="1" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="card-border-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="card-border-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="card-border-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="card-border-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;600;700;800&amp;display=swap');

    .section-title {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      font-weight: 800;
      font-size: 24px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .section-line {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      font-weight: 300;
      font-size: 12px;
      fill: #64748b;
      letter-spacing: 2px;
    }
    .project-name {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      font-weight: 700;
      font-size: 16px;
      fill: #f1f5f9;
    }
    .project-desc {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      font-weight: 300;
      font-size: 12px;
      fill: #94a3b8;
      line-height: 1.4;
    }
    .tech-tag {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      font-weight: 600;
      font-size: 10px;
      letter-spacing: 0.5px;
    }
    .project-icon {
      font-size: 22px;
    }
    .award-text {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      font-weight: 600;
      font-size: 10px;
      fill: #fbbf24;
    }

    .rise-1 { animation: riseIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both; }
    .rise-2 { animation: riseIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both; }
    .rise-3 { animation: riseIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both; }
    .rise-4 { animation: riseIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.55s both; }
    .rise-5 { animation: riseIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both; }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .rise-1, .rise-2, .rise-3, .rise-4, .rise-5 { animation-duration: 0.01s; }
    }
  </style>

  <!-- Background -->
  <rect width="840" height="520" rx="12" fill="#0a0a0f"/>

  <!-- Nebula accents -->
  <circle cx="120" cy="250" r="100" fill="#22d3ee" opacity="0.03" filter="url(#nb)"/>
  <circle cx="720" cy="300" r="120" fill="#8b5cf6" opacity="0.04" filter="url(#nb)"/>

  <!-- Background stars (sparse) -->
  <g filter="url(#sg)" opacity="0.4">
    <circle cx="55" cy="28" r="0.5" fill="#e2e8f0"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="45" r="0.6" fill="#e2e8f0"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="4.2s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="20" r="0.5" fill="#cbd5e1"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.8s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="35" r="0.6" fill="#e2e8f0"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="4.5s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="25" r="0.5" fill="#e2e8f0"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.3s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="40" r="0.7" fill="#cbd5e1"><animate attributeName="opacity" values="0.4;0.85;0.4" dur="4s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="100" cy="490" r="0.5" fill="#e2e8f0"><animate attributeName="opacity" values="0.3;0.7;0.3" dur="3.6s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="500" r="0.6" fill="#e2e8f0"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4.1s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="495" r="0.5" fill="#cbd5e1"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.9s" begin="0.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ====== SECTION TITLE ====== -->
  <g class="rise-1">
    <text x="420" y="50" text-anchor="middle" class="section-title">⚡ Featured Projects</text>
    <line x1="310" y1="62" x2="530" y2="62" stroke="#7c3aed" stroke-width="1" opacity="0.3">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ====== PROJECT 1 — AgroProfit ====== -->
  <g class="rise-2">
    <rect x="40" y="85" width="370" height="190" rx="10" fill="#0f0f18" stroke="url(#card-border-1)" stroke-width="1"/>
    <text x="70" y="118" class="project-icon">🌾</text>
    <text x="100" y="118" class="project-name">AgroProfit</text>
    <text x="70" y="142" class="project-desc">AI agricultural market platform with real-time mandi price</text>
    <text x="70" y="158" class="project-desc">data and Gemini API-powered crop advisory system.</text>

    <!-- Tech tags -->
    <rect x="70" y="172" width="48" height="20" rx="4" fill="#1e1b4b" stroke="#7c3aed" stroke-width="0.5"/>
    <text x="94" y="186" text-anchor="middle" class="tech-tag" fill="#a78bfa">React</text>

    <rect x="125" y="172" width="80" height="20" rx="4" fill="#1e1b4b" stroke="#7c3aed" stroke-width="0.5"/>
    <text x="165" y="186" text-anchor="middle" class="tech-tag" fill="#a78bfa">TypeScript</text>

    <rect x="212" y="172" width="68" height="20" rx="4" fill="#0c3547" stroke="#22d3ee" stroke-width="0.5"/>
    <text x="246" y="186" text-anchor="middle" class="tech-tag" fill="#67e8f9">Supabase</text>

    <rect x="287" y="172" width="78" height="20" rx="4" fill="#1a1a2e" stroke="#a855f7" stroke-width="0.5"/>
    <text x="326" y="186" text-anchor="middle" class="tech-tag" fill="#c4b5fd">Gemini API</text>

    <!-- Award badge -->
    <rect x="70" y="205" width="205" height="18" rx="4" fill="#422006" stroke="#fbbf24" stroke-width="0.5" opacity="0.8"/>
    <text x="80" y="218" class="award-text">🏆 Lenovo LEAP AI Innovation Award</text>

    <!-- Link indicator -->
    <rect x="70" y="240" width="95" height="22" rx="6" fill="none" stroke="#7c3aed" stroke-width="0.8" opacity="0.5"/>
    <text x="117" y="255" text-anchor="middle" class="tech-tag" fill="#a78bfa">Full-Stack</text>
    <rect x="175" y="240" width="60" height="22" rx="6" fill="none" stroke="#22d3ee" stroke-width="0.8" opacity="0.5"/>
    <text x="205" y="255" text-anchor="middle" class="tech-tag" fill="#67e8f9">AI/ML</text>
  </g>

  <!-- ====== PROJECT 2 — Smart Eco-Well ====== -->
  <g class="rise-3">
    <rect x="430" y="85" width="370" height="190" rx="10" fill="#0f0f18" stroke="url(#card-border-2)" stroke-width="1"/>
    <text x="460" y="118" class="project-icon">💧</text>
    <text x="490" y="118" class="project-name">Smart Eco-Well</text>
    <text x="460" y="142" class="project-desc">IoT water quality monitoring with ESP32, TDS/turbidity/pH</text>
    <text x="460" y="158" class="project-desc">sensors streaming to a real-time cloud dashboard.</text>

    <!-- Tech tags -->
    <rect x="460" y="172" width="52" height="20" rx="4" fill="#0c3547" stroke="#22d3ee" stroke-width="0.5"/>
    <text x="486" y="186" text-anchor="middle" class="tech-tag" fill="#67e8f9">ESP32</text>

    <rect x="519" y="172" width="78" height="20" rx="4" fill="#0c3547" stroke="#22d3ee" stroke-width="0.5"/>
    <text x="558" y="186" text-anchor="middle" class="tech-tag" fill="#67e8f9">IoT Sensors</text>

    <rect x="604" y="172" width="65" height="20" rx="4" fill="#1e1b4b" stroke="#7c3aed" stroke-width="0.5"/>
    <text x="636" y="186" text-anchor="middle" class="tech-tag" fill="#a78bfa">I2C/SPI</text>

    <rect x="676" y="172" width="52" height="20" rx="4" fill="#1a1a2e" stroke="#a855f7" stroke-width="0.5"/>
    <text x="702" y="186" text-anchor="middle" class="tech-tag" fill="#c4b5fd">Cloud</text>

    <rect x="460" y="240" width="90" height="22" rx="6" fill="none" stroke="#22d3ee" stroke-width="0.8" opacity="0.5"/>
    <text x="505" y="255" text-anchor="middle" class="tech-tag" fill="#67e8f9">Embedded</text>
    <rect x="560" y="240" width="50" height="22" rx="6" fill="none" stroke="#06b6d4" stroke-width="0.8" opacity="0.5"/>
    <text x="585" y="255" text-anchor="middle" class="tech-tag" fill="#22d3ee">IoT</text>
  </g>

  <!-- ====== PROJECT 3 — Lead Genius ====== -->
  <g class="rise-4">
    <rect x="40" y="295" width="370" height="190" rx="10" fill="#0f0f18" stroke="url(#card-border-3)" stroke-width="1"/>
    <text x="70" y="328" class="project-icon">🎯</text>
    <text x="100" y="328" class="project-name">Lead Genius</text>
    <text x="70" y="352" class="project-desc">Automated lead-extraction pipeline with multi-layer NLP</text>
    <text x="70" y="368" class="project-desc">role detection and DNS MX-validated email generation.</text>

    <rect x="70" y="382" width="58" height="20" rx="4" fill="#0c3547" stroke="#22d3ee" stroke-width="0.5"/>
    <text x="99" y="396" text-anchor="middle" class="tech-tag" fill="#67e8f9">Node.js</text>

    <rect x="135" y="382" width="40" height="20" rx="4" fill="#1a1a2e" stroke="#a855f7" stroke-width="0.5"/>
    <text x="155" y="396" text-anchor="middle" class="tech-tag" fill="#c4b5fd">NLP</text>

    <rect x="182" y="382" width="73" height="20" rx="4" fill="#1e1b4b" stroke="#7c3aed" stroke-width="0.5"/>
    <text x="218" y="396" text-anchor="middle" class="tech-tag" fill="#a78bfa">Serper API</text>

    <rect x="262" y="382" width="83" height="20" rx="4" fill="#0c3547" stroke="#22d3ee" stroke-width="0.5"/>
    <text x="303" y="396" text-anchor="middle" class="tech-tag" fill="#67e8f9">Web Scraping</text>

    <rect x="70" y="450" width="85" height="22" rx="6" fill="none" stroke="#a855f7" stroke-width="0.8" opacity="0.5"/>
    <text x="112" y="465" text-anchor="middle" class="tech-tag" fill="#c4b5fd">Backend</text>
    <rect x="165" y="450" width="90" height="22" rx="6" fill="none" stroke="#a855f7" stroke-width="0.8" opacity="0.5"/>
    <text x="210" y="465" text-anchor="middle" class="tech-tag" fill="#c4b5fd">Automation</text>
  </g>

  <!-- ====== PROJECT 4 — yt-cli ====== -->
  <g class="rise-5">
    <rect x="430" y="295" width="370" height="190" rx="10" fill="#0f0f18" stroke="url(#card-border-4)" stroke-width="1"/>
    <text x="460" y="328" class="project-icon">📺</text>
    <text x="490" y="328" class="project-name">yt-cli</text>
    <text x="460" y="352" class="project-desc">Terminal-based YouTube client — search, stream, and</text>
    <text x="460" y="368" class="project-desc">download videos right from the command line.</text>

    <rect x="460" y="382" width="55" height="20" rx="4" fill="#422006" stroke="#fbbf24" stroke-width="0.5"/>
    <text x="487" y="396" text-anchor="middle" class="tech-tag" fill="#fbbf24">Python</text>

    <rect x="522" y="382" width="38" height="20" rx="4" fill="#0c3547" stroke="#22d3ee" stroke-width="0.5"/>
    <text x="541" y="396" text-anchor="middle" class="tech-tag" fill="#67e8f9">CLI</text>

    <rect x="567" y="382" width="56" height="20" rx="4" fill="#1e1b4b" stroke="#7c3aed" stroke-width="0.5"/>
    <text x="595" y="396" text-anchor="middle" class="tech-tag" fill="#a78bfa">yt-dlp</text>

    <!-- Stars count -->
    <text x="460" y="430" class="tech-tag" fill="#fbbf24">⭐ 1 Star  ·  1 Fork</text>

    <rect x="460" y="450" width="60" height="22" rx="6" fill="none" stroke="#fbbf24" stroke-width="0.8" opacity="0.5"/>
    <text x="490" y="465" text-anchor="middle" class="tech-tag" fill="#fbbf24">Tools</text>
    <rect x="530" y="450" width="75" height="22" rx="6" fill="none" stroke="#fbbf24" stroke-width="0.8" opacity="0.5"/>
    <text x="567" y="465" text-anchor="middle" class="tech-tag" fill="#fbbf24">Open Source</text>
  </g>
</svg>
