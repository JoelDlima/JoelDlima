name: profile stats

on:
  schedule:
    # Twice a day, off the hour so it isn't competing with everyone else's cron.
    - cron: "23 4,16 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_stats.py"
      - "scripts/gh.py"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render contribution, streak and language cards
        env:
          # Needs a PAT: the GraphQL contributions API will not answer for the
          # default GITHUB_TOKEN. read:user is the minimum; add repo to have
          # private contributions counted too.
          GH_TOKEN: ${{ secrets.TEST_123 }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/build_stats.py

      - name: Commit if anything moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gen
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: refresh profile stat cards"
            git push
          fi
