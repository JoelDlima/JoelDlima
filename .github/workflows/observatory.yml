name: observatory

on:
  schedule:
    # Daily. GitHub keeps traffic for 14 days, so as long as this runs more
    # often than fortnightly the stored history never has a hole in it.
    - cron: "41 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_observatory.py"
      - "scripts/gh.py"
      - ".github/workflows/observatory.yml"

permissions:
  contents: write

concurrency:
  group: observatory
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect traffic and audience
        env:
          # The traffic API needs push access on every repository being read,
          # so this has to be a PAT — GITHUB_TOKEN only reaches this one repo.
          GH_TOKEN: ${{ secrets.TEST_123 }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/build_observatory.py

      - name: Commit if anything moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gen data
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: update observatory"
            git push
          fi
