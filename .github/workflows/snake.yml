name: contribution snake

on:
  schedule:
    # Twice a day, off the hour so it isn't competing with everyone else's cron.
    - cron: "17 3,15 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Render the contribution grid as a snake
        # svg-only is the lighter variant of Platane/snk — no GIF encoder pulled in.
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#f6bd60
            dist/snake-light.svg?palette=github-light&color_snake=#c2872a

      - name: Publish to the output branch
        run: |
          cd dist
          git init -q -b output
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "chore: regenerate contribution snake"
          # Generated artefacts only — a fresh history each run keeps the repo small.
          git push -f \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:output
