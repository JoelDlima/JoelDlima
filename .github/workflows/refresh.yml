name: refresh profile card

# Re-renders the poster from live GitHub data. Commits assets/ only when the
# rendered bytes actually change, so an unchanged day produces no commit.
on:
  schedule:
    - cron: '30 0 * * *' # 00:30 UTC — 06:00 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'data/**'
      - 'build/fonts/**'
      - 'package.json'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Refresh data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run data

      - name: Render
        # `gh api` reads GH_TOKEN. The default token is enough for the public
        # repo and language data this card uses; no PAT is required.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain assets data)" ]; then
            echo "No change."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets data
          git commit -m 'chore: refresh profile card'
          git push
