<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Joel Dlima — Electronics &amp; Computer Engineering student, embedded and full-stack engineer, Software Engineering intern at Visteon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E1A"/>
      <stop offset="0.55" stop-color="#10142B"/>
      <stop offset="1" stop-color="#141A3D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#22D3EE" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <g stroke="#FFFFFF" stroke-opacity="0.035">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/>
  </g>

  <rect x="564" y="96" width="72" height="5" rx="2.5" fill="url(#accent)">
    <animate attributeName="opacity" values="1;0.5;1" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <text x="600" y="172" text-anchor="middle" fill="#FFFFFF" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="68" font-weight="700">Joel Dlima</text>
  <text x="600" y="218" text-anchor="middle" fill="#22D3EE" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" font-weight="600">Electronics &amp; Computer Engineering · Embedded × Full-Stack</text>
  <text x="600" y="252" text-anchor="middle" fill="#8B93A7" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="18">ESP32 &#8594; sensors &#8594; WiFi &#8594; cloud dashboard</text>

  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13">
    <rect x="387" y="264" width="118" height="28" rx="14" fill="#1A2138" stroke="#6366F1" stroke-opacity="0.55"/>
    <text x="446" y="282" text-anchor="middle" fill="#C9D1D9">Mapusa, Goa</text>

    <rect x="521" y="264" width="180" height="28" rx="14" fill="#1A2138" stroke="#22D3EE" stroke-opacity="0.55"/>
    <text x="611" y="282" text-anchor="middle" fill="#C9D1D9">SWE Intern @ Visteon</text>

    <rect x="717" y="264" width="96" height="28" rx="14" fill="#1A2138" stroke="#6366F1" stroke-opacity="0.55"/>
    <text x="765" y="282" text-anchor="middle" fill="#C9D1D9">CGPA 9.7</text>
  </g>
</svg>
